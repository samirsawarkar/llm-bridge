[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bridge"
version = "2.0.0"
description = "Local OpenRouter-style API over your Antigravity, Claude Code and Codex OAuth sessions"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Samir Sawarkar", email = "samirsawarkars@gmail.com" }
]
keywords = ["llm", "proxy", "openai-compatible", "anthropic", "codex", "antigravity", "gemini", "claude", "oauth", "gateway"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/samirsawarkar/llm-bridge"
Documentation = "https://github.com/samirsawarkar/llm-bridge#readme"
Repository = "https://github.com/samirsawarkar/llm-bridge.git"
Issues = "https://github.com/samirsawarkar/llm-bridge/issues"
Changelog = "https://github.com/samirsawarkar/llm-bridge/blob/main/CHANGELOG.md"

[project.scripts]
llm-bridge = "llm_bridge.cli:main"
lbr = "llm_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
